<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Task Manager</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            align-items: center;
        }

        .auth-container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h1 {
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            font-size: 1.75rem;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>Set New Password</h1>
            <p>Enter the code and your new password.</p>
        </div>
        <form id="reset-form">
            <div class="form-group" style="margin-bottom: 1rem;">
                <label>Reset Code</label>
                <input type="text" id="code" required placeholder="6-digit code">
            </div>
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label>New Password</label>
                <input type="password" id="newPassword" required>
            </div>
            <button type="submit" class="btn-save" style="margin-top: 0; width: 100%;">Reset Password</button>
        </form>
    </div>
    <script>
        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = localStorage.getItem('resetEmail');
            const code = document.getElementById('code').value;
            const newPassword = document.getElementById('newPassword').value;

            if (!email) {
                alert('Session expired. Please start over.');
                window.location.href = 'forgot-password.html';
                return;
            }

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code, newPassword })
                });
                const data = await res.json();

                if (res.ok) {
                    alert('Password reset successful! Please login.');
                    localStorage.removeItem('resetEmail');
                    window.location.href = 'login.html';
                } else {
                    alert(data.message);
                }
            } catch (err) {
                console.error(err);
                alert('An error occurred');
            }
        });
    </script>
</body>

</html>
