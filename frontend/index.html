<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1><i class="fas fa-check-double"></i> Task Manager</h1>
                    <p>Stay organized and get things done.</p>
                </div>
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <button onclick="toggleTheme()"
                        style="background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-color);"><i
                            class="fas fa-moon"></i></button>
                    <button onclick="logout()"
                        style="background: none; border: 1px solid var(--danger-color); color: var(--danger-color); padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer;">Logout</button>
                </div>
            </div>
        </header>

        <div class="dashboard-stats">
            <div class="stat-card">
                <h3>Task Status</h3>
                <canvas id="statusChart"></canvas>
            </div>
            <div class="stat-card">
                <h3>Priority Distribution</h3>
                <canvas id="priorityChart"></canvas>
            </div>
        </div>

        <div class="task-form-container">
            <form id="task-form">
                <div class="form-group">
                    <input type="text" id="task-title" placeholder="What needs to be done?" required>
                </div>
                <div class="form-group">
                    <input type="text" id="task-desc" placeholder="Add a description (optional)">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <select id="task-priority">
                            <option value="Low">Low Priority</option>
                            <option value="Medium" selected>Medium Priority</option>
                            <option value="High">High Priority</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <input type="date" id="task-date">
                    </div>
                    <div class="form-group">
                        <input type="time" id="task-time">
                    </div>
                </div>
                <button type="submit" class="btn-add"><i class="fas fa-plus"></i> Add Task</button>
            </form>
        </div>

        <div class="tasks-container">
            <div class="tasks-header">
                <h2>My Tasks</h2>
                <div class="filter-controls">
                    <span class="active" data-filter="all">All</span>
                    <span data-filter="pending">Pending</span>
                    <span data-filter="completed">Completed</span>
                </div>
            </div>
            <ul id="task-list" class="task-list">
                <!-- Tasks will be added here dynamically -->
            </ul>
            <div id="pagination-controls" class="pagination-container"></div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 class="modal-title-text">Edit Task</h2>
            <form id="edit-form">
                <input type="hidden" id="edit-id">
                <div class="form-group">
                    <label for="edit-title">Title</label>
                    <input type="text" id="edit-title" required>
                </div>
                <div class="form-group">
                    <label for="edit-desc">Description</label>
                    <textarea id="edit-desc" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="edit-status">Status</label>
                    <select id="edit-status">
                        <option value="Pending">Pending</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="edit-date">Due Date</label>
                    <input type="date" id="edit-date">
                </div>
                <div class="form-group">
                    <label for="edit-time">Due Time</label>
                    <input type="time" id="edit-time">
                </div>
                <button type="submit" class="btn-save">Save Changes</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
